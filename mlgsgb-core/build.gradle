plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.dracoxavierseverin.memorylinkgraphstoregpubridge'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.DracoXavierSeverin'
                artifactId = 'MemoryLinkGraphStoreGpuBridge'
                version = '1.0.0'
            }
        }
    }
}
